# 올릴 때마다: 엔진·서버 단위 테스트 + 클라우드 SQL 과 파이썬이 같은 답인지(진짜 Postgres) + 사이트·QR 검사
name: test
on:
  push:
    branches: [master]   # live-data(실시간 결과, 10분마다) 는 검사하지 않음
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:   # 클라우드 SQL(supabase/*.sql) 이 파이썬 엔진과 같은 답인지 진짜 Postgres 에서 (tests/test_sql_parity.py)
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tests/web/qr.test.js && node tests/web/site.test.js
